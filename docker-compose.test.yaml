name: finance-quant-isolated-tests
services:
  test-db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: finance_quant_test
      POSTGRES_USER: fq_test
      POSTGRES_PASSWORD: isolated-test-only
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U fq_test -d finance_quant_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  test:
    build:
      context: .
      target: test
    environment:
      POSTGRES_HOST: test-db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: finance_quant_test
      POSTGRES_USER: fq_test
      POSTGRES_PASSWORD: isolated-test-only
      FINANCE_QUANT_TEST_POSTGRES: "1"
      STORAGE_ROOT: /tmp/fq-test-storage
      FINANCE_QUANT_DATA: /tmp/fq-test-storage/data
      FINANCE_QUANT_RUNS: /tmp/fq-test-storage/runs
      FINANCE_QUANT_INDUSTRY_ROOT: /tmp/fq-test-storage/data/industries
      FINANCE_QUANT_BENCHMARK_ROOT: /tmp/fq-test-storage/data/benchmarks
      FINANCE_QUANT_QUOTA_DB: /tmp/fq-test-storage/quota.sqlite3
    depends_on:
      test-db:
        condition: service_healthy
    command: [python, -m, pytest, -q, tests/test_backup.py, tests/test_data_updates.py, tests/integration/test_backup_updates.py, --basetemp, /tmp/fq-tests]
