[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finance-quant"
version = "0.1.0"
description = "Local factor research and Qlib backtesting workspace"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pyqlib==0.9.7",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pandas>=2.2,<3",
  "pyarrow>=17",
  "tushare>=1.4,<2",
  "python-dotenv>=1,<2",
  "filelock>=3,<5",
  "baostock>=0.9.4,<0.10",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
finance-quant = "finance_quant.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/finance_quant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
