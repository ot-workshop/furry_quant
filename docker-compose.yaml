x-app: &app
  image: ${APP_IMAGE:?Set APP_IMAGE in .env}
  init: true
  environment:
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    POSTGRES_DB: ${POSTGRES_DB:-finance_quant}
    POSTGRES_USER: ${POSTGRES_USER:-quant}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    STORAGE_ROOT: /app/storage
    BACKUP_ROOT: /backups
    RESTORE_ROOT: /restores
    RESTORE_POSTGRES_USER: ${RESTORE_POSTGRES_USER:-${POSTGRES_USER:-quant}}
    RESTORE_POSTGRES_PASSWORD: ${RESTORE_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD}}
    FINANCE_QUANT_RUNS: /app/storage/runs
    FINANCE_QUANT_DATA: /app/storage/data
    FINANCE_QUANT_QUOTA_DB: /app/storage/network/quota.sqlite3
    TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
    TUSHARE_HTTP_URL: https://api.tushare.pro
    FRONTEND_DIST: /app/frontend/dist
    HTTP_HOST: 0.0.0.0
    HTTP_PORT: "8000"
    ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://127.0.0.1:8000,http://localhost:8000}
    TZ: Asia/Shanghai
  volumes: &app-volumes
    - ${STORAGE_ROOT:-./storage}:/app/storage
    - ${BACKUP_ROOT:-./backups}:/backups
    - ${RESTORE_ROOT:-./restores}:/restores
  stop_grace_period: 90s

services:
  storage-init:
    image: ${APP_IMAGE:?Set APP_IMAGE in .env}
    user: "0:0"
    command: [chown, "quant:quant", /app/storage, /backups, /restores]
    volumes: *app-volumes
    restart: "no"

  db:
    image: ${POSTGRES_IMAGE:-postgres:18.6-bookworm}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finance_quant}
      POSTGRES_USER: ${POSTGRES_USER:-quant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: Asia/Shanghai
    volumes:
      - ${POSTGRES_DATA_ROOT:-./postgres}:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'PGPASSWORD="$${POSTGRES_PASSWORD}" psql -X -w -h db -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -Atqc "SELECT 1" >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    shm_size: 256mb

  migrate:
    <<: *app
    command: [python, -m, finance_quant.server, migrate]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully

  api:
    <<: *app
    command: [python, -m, finance_quant.server, api]
    restart: unless-stopped
    ports:
      - "${HTTP_BIND_HOST:-127.0.0.1}:${HTTP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4).read()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    <<: *app
    command: [python, -m, finance_quant.server, worker]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  maintenance:
    <<: *app
    profiles: [tools]
    command: [python, -m, finance_quant.backup, --help]
    depends_on:
      db:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
