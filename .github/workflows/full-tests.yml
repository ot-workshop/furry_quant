name: Full test suite

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_DB: finance_quant_test
          POSTGRES_USER: quant_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quant_test -d finance_quant_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv==0.10.0

      - name: Install Python dependencies
        run: uv sync --locked --extra dev

      - name: Check Python style and types
        run: |
          uv run ruff check src alembic tests scripts
          uv run ruff format --check src alembic tests scripts
          uv run mypy

      - name: Verify migrations on PostgreSQL
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5432"
          POSTGRES_DB: finance_quant_test
          POSTGRES_USER: quant_test
          POSTGRES_PASSWORD: test-only-password
        run: uv run alembic upgrade head

      - name: Run backend tests
        run: >-
          uv run pytest -q
          --basetemp /tmp/finance-quant-tests
          -o cache_dir=/tmp/finance-quant-pytest-cache

      - name: Run PostgreSQL repository integration tests
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5432"
          POSTGRES_DB: finance_quant_test
          POSTGRES_USER: quant_test
          POSTGRES_PASSWORD: test-only-password
          FINANCE_QUANT_TEST_POSTGRES: "1"
        run: >-
          uv run pytest -q tests/integration/test_postgres_runtime.py
          --basetemp /tmp/finance-quant-postgres-tests
          -o cache_dir=/tmp/finance-quant-postgres-pytest-cache

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci --no-audit --no-fund

      - name: Test frontend
        run: |
          npm --prefix frontend run format:check
          npm --prefix frontend test

      - name: Type-check and build frontend
        run: npm --prefix frontend run build
