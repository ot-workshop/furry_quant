name: Full test suite

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backup-restore:
    name: backup-restore
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Record checked-out commit
        run: |
          echo "event=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"
          echo "checked_sha=$(git rev-parse HEAD)"
          echo "github_sha=${{ github.sha }}"
          echo "pr_head_sha=${{ github.event.pull_request.head.sha }}"
          echo "pr_base_sha=${{ github.event.pull_request.base.sha }}"

      - name: Test shipped image and complete backup restore in isolated services
        run: docker compose -f docker-compose.test.yaml up --build --abort-on-container-exit --exit-code-from test

      - name: Remove test services
        if: always()
        run: docker compose -f docker-compose.test.yaml down --volumes

      - name: Build application image for Compose checks
        run: docker build --target application -t finance-quant:startup-check .

      - name: Verify automatic initialization and migrations in isolated projects
        run: python3 scripts/check_compose_startup.py --image finance-quant:startup-check

  test:
    name: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_DB: finance_quant_test
          POSTGRES_USER: quant_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quant_test -d finance_quant_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Record checked-out commit
        run: |
          echo "event=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"
          echo "checked_sha=$(git rev-parse HEAD)"
          echo "github_sha=${{ github.sha }}"
          echo "pr_head_sha=${{ github.event.pull_request.head.sha }}"
          echo "pr_base_sha=${{ github.event.pull_request.base.sha }}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv==0.10.0

      - name: Install Python dependencies
        run: uv sync --locked --extra dev

      - name: Check Python style and types
        run: |
          uv run ruff check src alembic tests scripts
          uv run ruff format --check src alembic tests scripts
          uv run mypy

      - name: Verify migrations on PostgreSQL
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5432"
          POSTGRES_DB: finance_quant_test
          POSTGRES_USER: quant_test
          POSTGRES_PASSWORD: test-only-password
        run: uv run alembic upgrade head

      - name: Run backend unit tests
        run: >-
          uv run pytest -ra --ignore=tests/integration
          --basetemp /tmp/finance-quant-tests
          -o cache_dir=/tmp/finance-quant-pytest-cache

      # Cover all 16 non-backup PostgreSQL integration cases; the 2 backup/restore
      # cases in test_backup_updates.py run in the backup-restore Compose job.
      - name: Run PostgreSQL integration tests (fail if any skipped)
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5432"
          POSTGRES_DB: finance_quant_test
          POSTGRES_USER: quant_test
          POSTGRES_PASSWORD: test-only-password
          FINANCE_QUANT_TEST_POSTGRES: "1"
        run: |
          uv run pytest -v -ra tests/integration --ignore=tests/integration/test_backup_updates.py \
            --junitxml=/tmp/pg-integration.xml \
            --basetemp /tmp/finance-quant-postgres-tests \
            -o cache_dir=/tmp/finance-quant-postgres-pytest-cache
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("/tmp/pg-integration.xml").getroot()
          suite = root.find("testsuite") if root.tag == "testsuites" else root
          tests = int(suite.attrib.get("tests", 0))
          skipped = int(suite.attrib.get("skipped", 0))
          failures = int(suite.attrib.get("failures", 0))
          errors = int(suite.attrib.get("errors", 0))
          for case in suite.findall("testcase"):
              status = "skipped" if case.find("skipped") is not None else "failed" if (case.find("failure") is not None or case.find("error") is not None) else "passed"
              print(f"  [{status}] {case.attrib.get('classname')}::{case.attrib.get('name')}")
          print(f"PostgreSQL integration summary: tests={tests}, skipped={skipped}, failures={failures}, errors={errors}")
          assert tests >= 16, f"Expected at least 16 integration cases, got {tests}"
          assert skipped == 0, f"Required PostgreSQL integration tests were skipped ({skipped})"
          assert failures == 0 and errors == 0
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci --no-audit --no-fund

      - name: Test frontend
        run: |
          npm --prefix frontend run format:check
          npm --prefix frontend test

      - name: Type-check and build frontend
        run: npm --prefix frontend run build
