name: Build private container

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: quqionfree/my_quant_project

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          load: true
          tags: finance-quant:test
          cache-from: type=gha,scope=finance-quant
          cache-to: type=gha,mode=max,scope=finance-quant

      - name: Run image smoke tests
        run: >-
          docker run --rm finance-quant:test
          python -m pytest -q
          tests/test_server_development.py
          tests/test_startup.py
          tests/test_persistence_datasets.py
          tests/test_tushare_provider.py
          --basetemp /tmp/finance-quant-tests
          -o cache_dir=/tmp/finance-quant-pytest-cache

      - name: Log in to the private container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Define image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag
            type=raw,value=master,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=manual-${{ github.run_number }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push application image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: application
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=finance-quant
          cache-to: type=gha,mode=max,scope=finance-quant
          provenance: mode=max
          sbom: true

      - name: Report immutable image
        run: echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"
